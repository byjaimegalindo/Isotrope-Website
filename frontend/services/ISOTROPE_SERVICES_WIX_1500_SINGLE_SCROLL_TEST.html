<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISOTROPE | SERVICES — Approved editorial layout with Wix native scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--black:#000000;--matte:#1c1c1c;--purple:#8b07d1;--purple-hover:#8d45ff;--ink:#fff;--border:rgba(255,255,255,.24);--top:8%;--side:1.5%}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;background:#000;color:#fff;font-family:Poppins,Arial,sans-serif}
html.embedded,html.embedded body{width:100%;height:100%;overflow:hidden!important;overscroll-behavior:none}
html.embedded .runway{height:100%;width:100%}
button{font-family:inherit}
.experience{position:relative;height:100%;background:#000;isolation:isolate;overflow:hidden}
.viewport{position:relative;width:100%;height:100%;min-height:0;overflow:hidden;background:#000;contain:layout paint}
.services-word{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#000}
.services-word h1{font-family:'Archivo Black',Arial,sans-serif;font-size:clamp(48px,17vw,320px);font-weight:400;line-height:.9;letter-spacing:-.072em;color:#1c1c1c;text-align:center;margin:0;white-space:nowrap;transform-origin:center center;will-change:opacity;}
.cards{position:absolute;inset:var(--top) 0;z-index:2;overflow:hidden;pointer-events:none}
.card{position:absolute;inset:0 var(--side);z-index:3;display:grid;grid-template-columns:minmax(0,38.8%) minmax(0,61.2%);gap:0;background:#000;min-width:0;min-height:0;will-change:transform;pointer-events:auto}
.card[data-current="false"]{pointer-events:none}
.photo-area{position:relative;min-width:0;min-height:0;padding-right:clamp(12px,1.7vw,25px)}
.photo-frame{position:relative;width:100%;height:100%;min-height:0;overflow:hidden;border-radius:12px;background:#000}
.photo-frame img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;filter:grayscale(1);user-select:none;-webkit-user-drag:none}
.photo-number{position:absolute;left:clamp(18px,2.4vw,36px);bottom:clamp(11px,2vw,24px);z-index:2;font:700 clamp(94px,9vw,154px)/.82 Poppins,Arial,sans-serif;letter-spacing:-.075em;color:#fff}
.copy-area{position:relative;display:flex;align-items:center;min-width:0;min-height:0;padding-left:15%;padding-bottom:5.5%}
.copy-inner{width:100%;max-width:670px;min-width:0}
.service-title{font:700 53px/1.2 Poppins,Arial,sans-serif;letter-spacing:-.035em;text-transform:uppercase;color:#fff;margin:0 0 18px;overflow-wrap:break-word}
.service-title .accent{color:var(--purple)}
.strap{font:700 17px/1.45 Poppins,Arial,sans-serif;color:#fff;margin:0 0 14px}
.description{font:400 13px/1.6 Poppins,Arial,sans-serif;color:#fff;margin:0 0 19px;max-width:670px}
.accordions{margin:0 0 22px}
.accordion{border-top:1px solid var(--border)}
.accordion:last-child{border-bottom:1px solid var(--border)}
.acc-trigger{width:100%;min-height:54px;padding:5px 0;display:flex;align-items:center;justify-content:space-between;gap:18px;border:0;background:transparent;color:#fff;text-align:left;font:600 13px/1.4 Poppins,Arial,sans-serif;cursor:pointer}
.acc-trigger:focus-visible{outline:2px solid var(--purple-hover);outline-offset:2px}
.acc-icon{display:grid;place-items:center;width:24px;height:24px;flex:0 0 24px;border:1px solid rgba(255,255,255,.5);border-radius:50%;font:400 17px/1 Arial,sans-serif;transition:background .23s,border-color .23s,color .23s,transform .23s}
.acc-trigger:hover .acc-icon,.acc-trigger:focus-visible .acc-icon{background:var(--purple-hover);border-color:var(--purple-hover);color:#fff}
.accordion.is-open .acc-icon{transform:rotate(45deg);background:var(--purple);border-color:var(--purple)}
.acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.accordion.is-open .acc-panel{grid-template-rows:1fr}
.acc-inner{overflow:hidden;min-height:0}
.acc-content{padding:1px 16px 17px 0;color:#fff;font:400 12px/1.55 Poppins,Arial,sans-serif}
.acc-content h3{font:600 12px/1.5 Poppins,Arial,sans-serif;margin:8px 0}
.acc-content ul{margin:3px 0 0;padding-left:17px}
.acc-content li{margin:0 0 4px}
.acc-content p{margin:4px 0}
.contact{min-width:210px;width:210px;height:50px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;border:0;border-radius:8px;background:var(--purple);color:#fff;font:700 12px/1.2 Poppins,Arial,sans-serif;cursor:pointer;transition:background .2s}
.contact:hover,.contact:focus-visible{background:var(--purple-hover)}
.contact:focus-visible{outline:2px solid #fff;outline-offset:2px}
.card.has-open .description{display:none}
/* Wix Studio 1500px contract: 38.8/61.2, padding 1.5%, content inset 15%, body 13px/1.6, 210x50 button. */
@media(max-width:1280px){.service-title{font-size:clamp(34px,3.53vw,53px)}.copy-area{padding-left:12%}.strap{font-size:15px}}
@media(max-width:900px) and (min-width:701px){.copy-area{padding-left:10%}.service-title{font-size:clamp(30px,4vw,43px)}.description{font-size:12px;line-height:1.55}.photo-area{padding-right:15px}.cards{inset:7% 0}.card{inset:0 1.5%}.acc-trigger{min-height:46px}}
@media(max-width:700px){
 .cards{inset:3.5% 0 4%}
 .card{inset:0 4.5%;display:flex;flex-direction:column;gap:12px}
 .photo-area{padding:0;flex:0 0 28%;height:28%;min-height:0}
 .photo-frame{border-radius:11px}
 .photo-number{font-size:clamp(68px,19vw,112px);left:16px;bottom:12px}
 .copy-area{align-items:flex-start;display:flex;flex:1 1 auto;padding:0 0 0;min-height:0}
 .copy-inner{height:auto;max-height:100%;display:flex;flex-direction:column;min-height:0}
 .service-title{font-size:clamp(24px,7.4vw,39px);line-height:1.14;margin:0 0 8px;letter-spacing:-.035em}
 .strap{font-size:12.5px;line-height:1.35;margin:0 0 7px}
 .description{font-size:11.5px;line-height:1.46;margin:0 0 9px}
 .accordions{margin:0 0 11px}
 .acc-trigger{min-height:37px;font-size:11.5px}
 .acc-icon{width:22px;height:22px;flex-basis:22px}
 .acc-content{font-size:11px;line-height:1.45;padding-bottom:9px}
 .acc-content li{margin-bottom:3px}
 .contact{width:100%;min-width:0;height:46px;margin-top:auto;font-size:11px}
 .services-word h1{font-size:clamp(50px,16vw,112px)}
 .card.has-open .photo-area{flex-basis:21%;height:21%}
 .card.has-open .strap{display:none}
}
@media(max-width:380px){.cards{inset:3% 0 3.5%}.card{inset:0 4%;gap:9px}.photo-area{flex-basis:22%;height:22%}.service-title{font-size:clamp(23px,7.5vw,31px)}.description{font-size:11px;line-height:1.38}.strap{font-size:11.5px}.card.has-open .photo-area{flex-basis:17%;height:17%}}
@media(max-height:700px) and (min-width:701px){.cards{inset:6% 0}.card{inset:0 1.5%}.service-title{font-size:clamp(28px,3.1vw,46px)}.strap{font-size:14px}.description{font-size:12px;line-height:1.48}.acc-trigger{min-height:44px}.accordions{margin-bottom:12px}}
@media(prefers-reduced-motion:reduce){.acc-panel,.acc-icon,.contact{transition:none!important}}
/* Standalone file preview gets a real document scroll. Embedded Wix mode stays ONE scroll. */
html.standalone,html.standalone body{height:auto;min-height:100%;overflow:visible}
html.standalone .runway{height:calc(100svh + 2630px);position:relative}
html.standalone .experience{height:100svh;position:sticky;top:0}
html.standalone .preview-follow{height:100svh;background:#080808}
</style>
</head>

      <div class="services-word" id="servicesWord"><h1 id="word">SERVICES</h1></div>
      <div class="cards" id="cards"></div>
    </div>
  </main>
</div>
<div class="preview-follow" id="previewFollow" hidden></div>

function makeData(rows){

function updateGeometry(){
 const h=Math.max(380,document.getElementById('viewport').getBoundingClientRect().height || window.innerHeight);

  let translate;

function relay(deltaY,deltaMode=0){
 if(!Number.isFinite(deltaY))return;
 const scale=deltaMode===1?16:deltaMode===2?window.innerHeight:1;
 const delta=deltaY*scale;
 if(embedded){window.parent.postMessage({type:PROTOCOL+'_INPUT',delta},'*')}
 else window.scrollBy({top:delta,behavior:'instant'});
}
window.addEventListener('message',event=>{
 const m=event.data||{};
 if(m.type===PROTOCOL+'_STATE' && Number.isFinite(m.value)){
  connected=true;render(m.value);
 }
 if(m.type==='ISOTROPE_SERVICES_DATA'&&Array.isArray(m.services)){
  makeData(m.services);
  announce();
 }
});
window.addEventListener('wheel',event=>{
 if(!embedded||event.ctrlKey)return;
 event.preventDefault();relay(event.deltaY,event.deltaMode);
},{passive:false,capture:true});
let touchY=null;
window.addEventListener('touchstart',e=>{touchY=e.touches.length===1?e.touches[0].clientY:null},{passive:true});
window.addEventListener('touchmove',e=>{
 if(!embedded||touchY===null||e.touches.length!==1)return;
 const y=e.touches[0].clientY,delta=touchY-y;touchY=y;
 if(Math.abs(delta)>.2){e.preventDefault();relay(delta,0)}
},{passive:false});
window.addEventListener('touchend',()=>touchY=null,{passive:true});
window.addEventListener('keydown',e=>{
 if(!embedded||e.target.closest('button'))return;
 const delta={ArrowDown:84,ArrowUp:-84,PageDown:450,PageUp:-450,Home:-1e5,End:1e5}[e.key];
 if(delta!==undefined){e.preventDefault();relay(delta,0)}
});
cardsRoot.addEventListener('click',e=>{
 const toggle=e.target.closest('.acc-trigger');
 if(toggle){
  const card=toggle.closest('.card');const acc=toggle.closest('.accordion');
  const open=!acc.classList.contains('is-open');
  card.querySelectorAll('.accordion').forEach(a=>{a.classList.remove('is-open');a.querySelector('.acc-trigger').setAttribute('aria-expanded','false')});
  acc.classList.toggle('is-open',open);toggle.setAttribute('aria-expanded',String(open));
  card.classList.toggle('has-open',open);
  return;
 }
 const button=e.target.closest('[data-action]');if(!button)return;
 const i=Number(button.dataset.action);const s=data[i];
 if(embedded){window.parent.postMessage({type:'ISOTROPE_CONTACT_CLICK',index:i,title:s.name,slug:s.slug||''},'*')}
 if(s.contactUrl||s.url){
  if(embedded)window.parent.postMessage({type:'ISOTROPE_CONTACT_NAVIGATE',url:s.contactUrl||s.url,service:s.name},'*');
  else window.location.href=s.contactUrl||s.url;
 }
});
window.addEventListener('scroll',()=>{
 if(embedded)return;
 const run=document.getElementById('runway');
 render(window.scrollY - run.offsetTop);
},{passive:true});
window.addEventListener('resize',()=>{updateGeometry();render(value);announce()},{passive:true});
makeData(DEFAULT_DATA);requestAnimationFrame(()=>{updateGeometry();render(value);announce()});
if(embedded){let tries=0;const timer=setInterval(()=>{if(connected||++tries>70)return clearInterval(timer);announce()},400)}
if(document.fonts)document.fonts.ready.then(()=>{fitWord();render(value)});
</script>
</body>
