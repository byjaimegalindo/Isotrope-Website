<script>
/* ISOTROPE SERVICES — independent native host bridge.
   Does not modify or listen to approved HERO/OUTRO channels. */
(function(){
 'use strict';
 const PREFIX='ISOTROPE_SERVICES_APPROVED_V17';
 let child=null,frame=null,max=2500,value=0,revision=0;
 const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
 function locate(){
  if(frame&&document.documentElement.contains(frame))return frame;
  if(!child)return null;
  for(const el of document.querySelectorAll('iframe')){
   try{if(el.contentWindow===child){frame=el;return el;}}catch(_){ }
  }
  return null;
 }
 function activeArea(){
  const el=locate();if(!el)return false;
  const r=el.getBoundingClientRect();
  const vh=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
  return Math.abs(r.top)<=Math.max(66,vh*.145) && r.bottom>vh*.58 && r.width>220;
 }
 function send(){try{child?.postMessage({type:PREFIX+'_STATE',value,max,revision:++revision},'*')}catch(_){}}
 function apply(delta){
  if(!Number.isFinite(delta)||!delta)return false;
  const el=locate();if(!el)return false;
  const r=el.getBoundingClientRect();
  const vh=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
  if(r.bottom<=vh*.2||r.top>=vh*.95)return false;
  let remaining=delta;
  // Do not skip the pin when one wheel gesture crosses it.
  if(r.top>2&&delta>0&&delta>=r.top){
   window.scrollBy(0,r.top);
   remaining=delta-r.top;
  }else if(r.top< -2&&delta<0&&delta<=r.top){
   window.scrollBy(0,r.top);
   remaining=delta-r.top;
  }else if(!activeArea())return false;
  if(remaining>0&&value>=max-.5){window.scrollBy(0,remaining);return true}
  if(remaining<0&&value<=.5){window.scrollBy(0,remaining);return true}
  const desired=value+remaining;
  value=clamp(desired,0,max);
  send();
  const spill=desired<0?desired:desired>max?desired-max:0;
  if(Math.abs(spill)>.5)window.scrollBy(0,spill);
  return true;
 }
 window.addEventListener('message',e=>{
  const m=e.data||{};
  if(m.type===PREFIX+'_READY'){
   if(child!==e.source){child=e.source;frame=null;value=0;}
   if(Number.isFinite(m.max)&&m.max>300)max=m.max;
   send();return;
  }
  if(e.source!==child)return;
  if(m.type===PREFIX+'_INPUT'){
   const delta=Number(m.delta)||0;
   if(!apply(delta))window.scrollBy(0,delta);
  }
 });
 // Events over native Wix columns next to the HTML should continue
 // to operate the very same card sequence, but only while aligned.
 window.addEventListener('wheel',e=>{
  if(!child||e.ctrlKey||e.defaultPrevented)return;
  const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?window.innerHeight:1);
  const r=locate()?.getBoundingClientRect();
  const crosses=!!r&&((delta>0&&r.top>2&&r.top<=delta)||(delta<0&&r.top< -2&&r.top>=delta));
  if((activeArea()&&((delta>0&&value<max-0.5)||(delta<0&&value>0.5)))||crosses){
   e.preventDefault();apply(delta);
  }
 },{capture:true,passive:false});
 window.addEventListener('resize',()=>{if(child)send()},{passive:true});
})();
</script>
