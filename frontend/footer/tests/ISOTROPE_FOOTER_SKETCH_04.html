<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISOTROPE — Footer sketch 04</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--black:#000;--white:#fff;--purple:#8B07D1;--hover:#8D45FF;--accent:#A477EB;--muted:#A5A5A5;--rule:#292929}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--black);color:var(--white)}body{font:400 15px/1.6 Poppins,Arial,sans-serif}footer{width:100%;background:var(--black);padding:42px 0 20px}.main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:24px;align-items:start;padding-bottom:42px}.group{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}.group h2{font-size:12px;font-weight:600;letter-spacing:1.7px;color:var(--accent);margin:0 0 10px;text-transform:uppercase}.group a,.legal a{color:var(--white);text-decoration:none}.group a:hover,.legal a:hover{color:var(--accent)}.contact{width:100%}.social{min-width:0}.social-links{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.social-links a{display:grid;place-items:center;width:38px;height:38px;color:var(--white);transition:color .2s}.social-links a:hover,.social-links a:focus-visible{color:var(--accent)}.social-links svg{width:26px;height:26px;display:block}.contact p{margin:0}.phone{color:var(--white)}.legal{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;border-top:1px solid var(--rule);padding-top:19px;color:var(--muted);font-size:12px}.legal a{font-size:12px;color:var(--muted)}.top{display:flex;justify-self:end;align-items:center;gap:12px;color:var(--white);background:none;border:0;padding:0;cursor:pointer;font:400 13px/1.4 Poppins,Arial,sans-serif}.circle{border:1px solid var(--white);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;transition:background .2s,border-color .2s}.top:hover .circle{background:var(--purple);border-color:var(--purple)}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
@media(max-width:1050px){.main{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:16px}.contact{max-width:none}.group{padding-right:12px}.contact{padding-right:0}body{font-size:14px}}
@media(max-width:750px){footer{padding:32px 0 20px}.main{grid-template-columns:1fr 1fr;gap:30px 16px;padding-bottom:30px}.contact{grid-column:auto;justify-self:start}.legal{grid-template-columns:1fr auto;gap:14px}.legal>span{grid-column:1/-1}.legal .top{justify-self:end}}
.top{position:relative}.top-label{position:absolute;right:58px;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .2s}.top:hover .top-label,.top:focus-visible .top-label{opacity:1;visibility:visible}.contact a{overflow-wrap:anywhere}
@media(max-width:420px){.main{grid-template-columns:1fr;gap:24px}.legal{grid-template-columns:1fr auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<footer aria-label="Site footer">
<div class="main">
  <nav class="group" aria-label="Company"><h2>Company</h2><a href="#" data-placeholder>About</a><a href="#" data-placeholder>How We Work</a><a href="#" data-placeholder>Why Us</a><a href="#" data-placeholder>Team Experience</a></nav>
  <nav class="group" aria-label="Our work"><h2>Our Work</h2><a href="#" data-placeholder>Services</a><a href="#" data-placeholder>Projects</a><a href="#" data-placeholder>Reviews</a></nav>
  <section class="group contact" aria-label="Contact"><h2>Get in Touch</h2><p>Melbourne, Australia</p><a href="mailto:admin@isotrope.com.au">admin@isotrope.com.au</a><p class="phone">+61 2 5550 1234</p></section>
  <nav class="group social" aria-label="Social Media"><h2>Social Media</h2><div class="social-links">
    <a href="#" data-placeholder aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
    <a href="#" data-placeholder aria-label="LinkedIn" title="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 2h-17A1.5 1.5 0 0 0 2 3.5v17A1.5 1.5 0 0 0 3.5 22h17a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 20.5 2ZM8 19H5V9h3ZM6.5 7.7a1.75 1.75 0 1 1 0-3.5 1.75 1.75 0 0 1 0 3.5ZM19 19h-3v-5.3c0-1.3-.45-2.1-1.6-2.1-1.25 0-1.9.85-1.9 2.1V19h-3V9h3v1.35A3.4 3.4 0 0 1 15.4 8.8c2.25 0 3.6 1.35 3.6 4.15Z"/></svg></a>
    <a href="#" data-placeholder aria-label="WhatsApp" title="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a9.85 9.85 0 0 0-8.5 14.82L2 22l5.35-1.4A10 10 0 1 0 12 2Zm0 18.18a8.15 8.15 0 0 1-4.16-1.14l-.3-.18-3.18.84.85-3.1-.2-.32A8.2 8.2 0 1 1 12 20.18Z"/><path d="M9.1 7.3c-.2-.46-.37-.47-.57-.48h-.55c-.2 0-.52.08-.79.38-.27.3-1.03 1-1.03 2.45 0 1.44 1.05 2.84 1.2 3.03.15.2 2.07 3.3 5.08 4.48 2.5.98 3.02.8 3.56.75.55-.05 1.76-.72 2.01-1.41.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.34l-1.96-.96c-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.34.22-.64.07-.3-.15-1.26-.46-2.4-1.49-.89-.8-1.49-1.78-1.66-2.08-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52Z" transform="translate(1 1) scale(.92)"/></svg></a>
  </div></nav>
</div>
<div class="legal"><span>© 2026 ISOTROPE. All rights reserved. · ABN 29 700 421 843</span><a href="https://miv-studio.wixstudio.com/isotrope-testing/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a><button class="top" type="button" aria-label="Back to top"><span class="top-label" aria-hidden="true">Back to top</span><span class="circle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 20V4M5 11l7-7 7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></div>
</footer>
<script>
// Appearance-only draft. Section destinations will be supplied later.
// Phone is the unconfirmed display sample in Contact popup V07; intentionally not a tel link.
document.querySelectorAll('[data-placeholder]').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
function send(type){if(window.parent!==window)window.parent.postMessage({type},'*');}
document.querySelector('.top').addEventListener('click',()=>{if(window.parent!==window)send('ISOTROPE_FOOTER_BACK_TO_TOP');else window.scrollTo({top:0,behavior:'smooth'});});
</script>
</body></html>
