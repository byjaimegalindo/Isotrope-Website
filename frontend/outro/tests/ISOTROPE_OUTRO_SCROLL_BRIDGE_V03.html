<script>
(function(){
  'use strict';
  const READY='ISOTROPE_OUTRO_V3_READY', SCROLL='ISOTROPE_OUTRO_V3_SCROLL';
  let child=null, frame=null, raf=0, previous=-1;
  const clamp=n=>Math.min(1,Math.max(0,n));
  function locate(source){
    for(const el of document.querySelectorAll('iframe')){
      try{if(el.contentWindow===source)return el;}catch(_){}
    }
    return null;
  }
  function send(){
    raf=0;
    if(!child)return;
    if(!frame||!document.documentElement.contains(frame)){
      frame=locate(child);
      if(!frame)return;
    }
    const rect=frame.getBoundingClientRect();
    const vh=Math.max(window.innerHeight||document.documentElement.clientHeight||1,1);
    if(rect.height<1)return;
    const travel=Math.max(Math.min(rect.height,vh)*0.85,1);
    const progress=clamp((vh-rect.top)/travel);
    if(Math.abs(progress-previous)<0.0001)return;
    try{
      child.postMessage({type:SCROLL,progress,viewportHeight:vh},'*');
      previous=progress;
    }catch(_){}
  }
  function schedule(){if(!raf)raf=requestAnimationFrame(send);}
  window.addEventListener('message',event=>{
    if(event.data?.type!==READY)return;
    const found=locate(event.source);
    if(!found)return;
    child=event.source;frame=found;previous=-1;schedule();
  });
  document.addEventListener('scroll',schedule,{capture:true,passive:true});
  window.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('pageshow',schedule,{passive:true});
  // Read-only geometry fallback for layout changes and custom scroll containers.
  setInterval(()=>{if(child)schedule();},120);
})();
</script>
