<script>
/* ISOTROPE SERVICES · Native Wix page scroll bridge.
   Wix Studio -> Settings -> Custom Code -> BODY_END, all pages OR Home only.
   Does not change the approved Hero/Outro integrations or use Velo polling.
   Install the HTML adapter COPY in a full-width native Wix section. */
(()=>{
 'use strict';
 const MSG='ISOTROPE_SERVICES_WIX_';
 let iframe=null,child=null,raf=0,sequence=0,activeScroller=null;
 const isEl=v=>v&&v.nodeType===1;
 function findFrame(source){
  if(iframe&&document.documentElement.contains(iframe)&&iframe.contentWindow===source)return iframe;
  for(const f of document.querySelectorAll('iframe')){
   try{if(f.contentWindow===source){iframe=f;return f}}catch(_){ }
  }
  return null;
 }
 function send(){
  raf=0;
  if(!iframe||!child||!document.documentElement.contains(iframe))return;
  const r=iframe.getBoundingClientRect();
  try{child.postMessage({type:MSG+'SCROLL',frameTop:r.top,
    viewportHeight:window.innerHeight||document.documentElement.clientHeight,
    viewportWidth:window.innerWidth||document.documentElement.clientWidth,
    sequence:++sequence},'*')}catch(_){ }
 }
 function schedule(){if(!raf)raf=requestAnimationFrame(send)}
 function scrollHost(){
  if(isEl(activeScroller)&&document.documentElement.contains(activeScroller)){
   if(activeScroller.scrollHeight>activeScroller.clientHeight+2)return activeScroller;
  }
  for(let p=iframe?.parentElement;p&&p!==document.documentElement;p=p.parentElement){
   if(p.scrollHeight>p.clientHeight+2&&/(auto|scroll)/.test(getComputedStyle(p).overflowY))return p;
  }
  return document.scrollingElement||document.documentElement;
 }
 function scrollPage(delta){
  const scroller=scrollHost();
  if(!scroller)return;
  scroller.scrollTop+=delta;
  schedule();
 }
 window.addEventListener('message',event=>{
  const m=event.data||{};
  if(m.type===MSG+'READY'){
   const f=findFrame(event.source);
   if(!f)return;
   child=event.source;schedule();return;
  }
  if(m.type===MSG+'WHEEL'&&event.source===child&&iframe){
   const factor=m.mode===1?16:m.mode===2?window.innerHeight:1;
   const dy=Number(m.delta)*factor;
   if(Number.isFinite(dy)&&Math.abs(dy)<10000)scrollPage(dy);
  }
 });
 document.addEventListener('scroll',event=>{
  if(isEl(event.target)&&event.target.scrollHeight>event.target.clientHeight+2)
   activeScroller=event.target;
  schedule();
 },true);
 window.addEventListener('scroll',schedule,{passive:true});
 window.addEventListener('resize',schedule,{passive:true});
 window.addEventListener('pageshow',schedule,{passive:true});
})();
</script>
